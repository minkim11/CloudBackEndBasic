name: CI/CD Pipeline (AWS ECR & OIDC)

on:
  push:
    branches: [ "main" ]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}

jobs:
  # ==================== CI Step ====================
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # ✅ [추가] 빌드 전 테스트 먼저 실행 — 실패 시 이후 단계 전체 중단
      - name: Run tests (pre-build health check)
        run: ./gradlew test

      # ✅ 테스트 실패 시 리포트 업로드 — 실패 원인 파악용
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 3

      # 테스트 통과 후 빌드 실행 (-x test로 테스트 중복 실행 방지)
      - name: Build with Gradle (skip test)
        run: ./gradlew build -x test

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: build/libs/*.jar
          retention-days: 1

  # ==================== CD Step ====================
  deploy-to-ec2:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-test.outputs.image_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: build/libs/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          FULL_IMAGE="$ECR_REGISTRY/$ECR_REPOSITORY"
          docker build -t "$FULL_IMAGE:$IMAGE_TAG" -t "$FULL_IMAGE:latest" .
          docker push "$FULL_IMAGE:$IMAGE_TAG"
          docker push "$FULL_IMAGE:latest"

      - name: SSH Remote Commands (Deploy to EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: AWS_REGION,ECR_REPOSITORY,IMAGE_TAG
          script: |
            REGISTRY="${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.$AWS_REGION.amazonaws.com"

            aws ecr get-login-password --region "$AWS_REGION" \
              | docker login --username AWS --password-stdin "$REGISTRY"

            docker pull "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            docker stop app-server || true
            docker rm app-server || true

            docker run -d \
              --name app-server \
              --restart unless-stopped \
              -p 80:8080 \
              "$REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

            echo "Health check 시작..."
            for i in $(seq 1 12); do
              sleep 5
              STATUS=$(curl -sf http://localhost/actuator/health | grep -o '"status":"UP"' || true)
              if [ -n "$STATUS" ]; then
                echo "Health check 통과 (${i}번째 시도)"
                break
              fi
              if [ "$i" -eq 12 ]; then
                echo "Health check 실패 — 배포 실패 처리"
                exit 1
              fi
            done

            docker image prune -f