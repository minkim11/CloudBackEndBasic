name: CI/CD Pipeline (Docker Hub & Single EC2)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  # ==================== CI Step ====================
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 1단계: 테스트 먼저 실행 — 실패 시 이후 단계 전체 중단
      - name: Run tests
        run: ./gradlew test

      # 테스트 실패 시 리포트 업로드
      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 3

      # 2단계: 테스트 통과 후 JAR 빌드
      # bootJar는 test task를 포함하지 않으므로 -x test 옵션 불필요
      - name: Build JAR
        run: ./gradlew bootJar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.set-tag.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  # ==================== CD Step ====================
  deploy-to-ec2:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-test.outputs.image_tag }}
    steps:
      - name: SSH Remote Commands (Deploy to EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG
          script: |
            IMAGE_URI="${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}"

            docker pull "$IMAGE_URI:$IMAGE_TAG"

            docker stop app-server || true
            docker rm app-server || true

            docker run -d \
              --name app-server \
              --restart unless-stopped \
              -p 80:8080 \
              "$IMAGE_URI:$IMAGE_TAG"

            docker image prune -f