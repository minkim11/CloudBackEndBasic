name: CI/CD Pipeline (Docker Hub & ASG)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write   # OIDC — ASG/Launch Template 제어용

jobs:
  # ==================== CI Step ====================
  build-and-test:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      image_name: ${{ steps.set-image.outputs.name }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Set image name (lowercase)
        id: set-image
        run: |
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ secrets.DOCKERHUB_USERNAME }}/${REPO}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 3

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.set-image.outputs.name }}:${{ steps.set-tag.outputs.tag }}
            ${{ steps.set-image.outputs.name }}:latest

  # ==================== CD Step ====================
  deploy-to-asg:
    needs: build-and-test
    runs-on: ubuntu-24.04-arm
    env:
      IMAGE_TAG: ${{ needs.build-and-test.outputs.image_tag }}
      IMAGE_NAME: ${{ needs.build-and-test.outputs.image_name }}
    steps:
      # OIDC로 AWS 인증 — ASG/Launch Template 제어 권한
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      # Launch Template 새 버전 생성 — User Data에 IMAGE_TAG 주입
      - name: Update Launch Template with new image tag
        run: |
          USER_DATA=$(cat <<EOF | base64 -w 0
          #!/bin/bash
          set -e
          DOCKERHUB_USERNAME="${{ secrets.DOCKERHUB_USERNAME }}"
          REPOSITORY_NAME="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE_TAG="${IMAGE_TAG}"
          IMAGE_URI="\${DOCKERHUB_USERNAME}/\${REPOSITORY_NAME}:\${IMAGE_TAG}"

          dnf update -y
          dnf install -y docker
          systemctl enable docker
          systemctl start docker

          docker pull \${IMAGE_URI}
          docker run -d -p 8080:8080 \
            --restart unless-stopped \
            --name app-server \
            -e SPRING_PROFILES_ACTIVE=prod \
            \${IMAGE_URI}
          EOF
          )

          aws ec2 create-launch-template-version \
            --launch-template-id ${{ secrets.LAUNCH_TEMPLATE_ID }} \
            --source-version '$Latest' \
            --launch-template-data "{\"UserData\":\"${USER_DATA}\"}"

      # ASG가 새 Launch Template 버전으로 EC2를 순차 교체
      - name: Trigger ASG Instance Refresh
        run: |
          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.ASG_NAME }} \
            --preferences '{
              "MinHealthyPercentage": 50,
              "InstanceWarmup": 60
            }'