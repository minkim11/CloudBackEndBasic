name: CI/CD Pipeline (Docker Hub & Single EC2)

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ github.event.repository.name }}

jobs:
  # ==================== CI Step ====================
  build-and-test:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.set-tag.outputs.tag }}
      image_name: ${{ steps.set-image.outputs.name }}   # CD로 전달
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set image tag
        id: set-tag
        run: echo "tag=${{ github.sha }}" >> $GITHUB_OUTPUT

      # 소문자 변환 — Docker Hub는 대문자 태그 불허
      - name: Set image name (lowercase)
        id: set-image
        run: |
          REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "name=${{ secrets.DOCKERHUB_USERNAME }}/${REPO}" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: Gradle Caching
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Upload test report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 3

      - name: Build JAR
        run: ./gradlew bootJar

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.set-image.outputs.name }}:${{ steps.set-tag.outputs.tag }}
            ${{ steps.set-image.outputs.name }}:latest

  # ==================== CD Step ====================
  deploy-to-ec2:
    needs: build-and-test
    runs-on: ubuntu-latest
    env:
      IMAGE_TAG: ${{ needs.build-and-test.outputs.image_tag }}
    steps:
      - name: SSH Remote Commands (Deploy to EC2)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: IMAGE_TAG
          script: |
            export PATH=$PATH:/usr/bin:/usr/local/bin

            # CD에서 직접 소문자 변환 — outputs 전달 의존 제거
            REPO=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
            IMAGE_NAME="${{ secrets.DOCKERHUB_USERNAME }}/${REPO}"

            echo "IMAGE_NAME: $IMAGE_NAME"   # 디버그용, 확인 후 삭제 가능
            echo "IMAGE_TAG: $IMAGE_TAG"

            docker pull "$IMAGE_NAME:$IMAGE_TAG"

            docker stop app-server || true
            docker rm app-server || true

            docker run -d \
              --name app-server \
              --restart unless-stopped \
              -p 80:8080 \
              "$IMAGE_NAME:$IMAGE_TAG"

            docker image prune -f